<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ brand_name }}{% endblock %}</title>
<script>
// Resolves the theme before the stylesheet is even requested, so the page
// never flashes light-then-dark (or the reverse) on load. Kept inline and
// ahead of the stylesheet link deliberately -- anything later runs after
// the browser has already started painting with the wrong theme.
(function () {
  var stored = localStorage.getItem("theme");           // "light" | "dark" | null (null = auto)
  var dark = stored ? stored === "dark"
                    : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme-choice", stored || "auto");
})();
</script>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block bodyclass %}app{% endblock %}">

{% block topbar %}
<header class="topbar">
  <div class="wrap">
    {% include "_mark.html" %}
    <div class="brand-text">
      <span class="brand-name">{{ brand_name }}</span>
      <span class="brand-sub">{{ brand_tagline }}</span>
    </div>
    <nav class="no-print">
      <a href="{{ url_for('index') }}">Scans</a>
      <a href="{{ url_for('logout') }}">Sign out</a>
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" title="Light" aria-label="Light theme">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" data-theme-choice="dark" title="Dark" aria-label="Dark theme">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
        <button type="button" data-theme-choice="auto" title="Match system" aria-label="Match system theme">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
        </button>
      </div>
    </nav>
  </div>
</header>
{% endblock %}

<main class="wrap">
{% block content %}{% endblock %}
</main>

<script>
(function () {
  var buttons = document.querySelectorAll("[data-theme-choice]");
  if (!buttons.length) return;

  function apply() {
    var stored = localStorage.getItem("theme");
    var dark = stored ? stored === "dark"
                      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var choice = stored || "auto";
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme-choice", choice);
    buttons.forEach(function (b) {
      b.classList.toggle("active", b.dataset.themeChoice === choice);
    });
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      var choice = b.dataset.themeChoice;
      if (choice === "auto") localStorage.removeItem("theme");
      else localStorage.setItem("theme", choice);
      apply();
    });
  });

  // Auto is live: if the reader has it selected and the OS theme changes
  // while the page is open, follow it rather than waiting for a reload.
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
    if (!localStorage.getItem("theme")) apply();
  });

  apply();
})();
</script>

</body>
</html>
