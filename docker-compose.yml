services:
  netscan:
    build:
      context: .
    image: nd-scanner:latest
    container_name: nd-scanner

    # naabu SYN scan needs raw sockets. Drop these and set SCAN_TYPE=c for an
    # unprivileged TCP connect scan (slower, noisier in target logs).
    cap_add:
      - NET_RAW
      - NET_ADMIN

    volumes:
      - ./targets:/targets:ro
      - ./output:/output

    environment:
      TARGET: "${TARGET:-}"
      # Set in .env so scan results are owned by you, not root.
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
      SCAN_TYPE: "${SCAN_TYPE:-s}"
      NAABU_TOP_PORTS: "${NAABU_TOP_PORTS:-1000}"
      NAABU_PORTS: "${NAABU_PORTS:-}"
      NAABU_RATE: "${NAABU_RATE:-1000}"
      HOST_SUBNETS: "${HOST_SUBNETS:-}"
      APPLIANCE_IPS: "${APPLIANCE_IPS:-}"
      NAABU_RATE_LOCAL: "${NAABU_RATE_LOCAL:-2000}"
      NAABU_RATE_ROUTED: "${NAABU_RATE_ROUTED:-300}"
      NAABU_CONCURRENCY: "${NAABU_CONCURRENCY:-25}"
      NMAP_ARGS: "${NMAP_ARGS:--sV -O -Pn -T3}"
      NUCLEI_SEVERITY: "${NUCLEI_SEVERITY:-info,low,medium,high,critical}"
      NUCLEI_RATE: "${NUCLEI_RATE:-150}"
      NUCLEI_CONCURRENCY: "${NUCLEI_CONCURRENCY:-25}"
      NUCLEI_TAGS: "${NUCLEI_TAGS:-}"
      NUCLEI_UPDATE: "${NUCLEI_UPDATE:-false}"
      SKIP_NMAP: "${SKIP_NMAP:-false}"
      SKIP_NUCLEI: "${SKIP_NUCLEI:-false}"
      TARGETS_FILE: "${TARGETS_FILE:-/targets/targets.txt}"

    # Resource ceiling. Raise or lower it per appliance.
    # Raise for beefier appliances, lower for a Pi-class box.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

    network_mode: bridge
    restart: "no"

  # Web UI: launch scans, watch progress, present findings to a client.
  #   docker compose up -d web   ->   http://<appliance-ip>:8080
  web:
    build:
      context: .
      args:
        BUILD_REF: "${BUILD_REF:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
    image: nd-scanner:latest
    container_name: nd-scanner-web
    entrypoint: ["python3", "/opt/webui/app.py"]

    # Reap orphaned scanner processes. Without an init, PID 1 is the Flask
    # app, which never adopts them, so every stopped scan leaves a zombie.
    init: true

    cap_add:
      - NET_RAW
      - NET_ADMIN

    ports:
      - "${WEBUI_PORT:-8080}:8080"

    volumes:
      - ./output:/output
      - ./branding:/branding:ro
      # Persisted so the certificate fingerprint stays stable and can be
      # trusted once, rather than re-accepted on every restart.
      - ./certs:/certs

    environment:
      HTTPS: "${HTTPS:-true}"
      # Add the appliance's LAN address so the cert matches the URL you use,
      # e.g. TLS_SAN=192.168.1.50  (comma-separated; IPs or hostnames)
      TLS_SAN: "${TLS_SAN:-}"
      TLS_CERT: "${TLS_CERT:-}"
      TLS_KEY: "${TLS_KEY:-}"
      # Leave WEBUI_PASSWORD unset and one is generated per start and printed
      # to `docker compose logs web`, so the UI is never left unauthenticated.
      WEBUI_PASSWORD: "${WEBUI_PASSWORD:-}"
      WEBUI_SECRET: "${WEBUI_SECRET:-}"
      BRAND_NAME: "${BRAND_NAME:-Network Defenders}"
      BRAND_TAGLINE: "${BRAND_TAGLINE:-Network Security Assessment}"
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
      # Scan knobs, so a setting in .env reaches UI-launched scans and not only
      # the CLI service. Profile choices in the UI override these per run.
      SCAN_TYPE: "${SCAN_TYPE:-s}"
      NAABU_TOP_PORTS: "${NAABU_TOP_PORTS:-1000}"
      NAABU_PORTS: "${NAABU_PORTS:-}"
      NAABU_RATE: "${NAABU_RATE:-1000}"
      HOST_SUBNETS: "${HOST_SUBNETS:-}"
      APPLIANCE_IPS: "${APPLIANCE_IPS:-}"
      BUILD_REF: "${BUILD_REF:-}"
      BUILD_DATE: "${BUILD_DATE:-}"
      UPDATE_CHECK_URL: "${UPDATE_CHECK_URL:-}"
      NAABU_RATE_LOCAL: "${NAABU_RATE_LOCAL:-2000}"
      NAABU_RATE_ROUTED: "${NAABU_RATE_ROUTED:-300}"
      NAABU_CONCURRENCY: "${NAABU_CONCURRENCY:-25}"
      NMAP_ARGS: "${NMAP_ARGS:--sV -O -Pn -T3}"
      NUCLEI_SEVERITY: "${NUCLEI_SEVERITY:-info,low,medium,high,critical}"
      NUCLEI_TAGS: "${NUCLEI_TAGS:-}"
      NUCLEI_RATE: "${NUCLEI_RATE:-150}"
      NUCLEI_CONCURRENCY: "${NUCLEI_CONCURRENCY:-25}"
      NUCLEI_UPDATE: "${NUCLEI_UPDATE:-false}"

    # Connect scanning needs a socket per probe. The stock 1024 descriptors and
    # a 60s TIME_WAIT cap sustained throughput at roughly 470/s regardless of
    # the configured rate, and exhausted probes look like filtered hosts.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.ipv4.ip_local_port_range: "10000 65000"
      net.ipv4.tcp_fin_timeout: "15"

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

    restart: unless-stopped
